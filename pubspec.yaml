name: task_management
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:

  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.8
  email_validator: ^3.0.0
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.1
  firebase_storage: ^12.3.6
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_localization: ^0.3.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  share_plus: ^10.1.3
  shared_preferences: ^2.3.4
  storage_client: ^2.2.0
  supabase_flutter: ^2.8.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - lib/assets/imgs/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # example:
  fonts:
      - family: PliatExtended
        fonts:
            - asset: lib/assets/fonts/PilatExtended-Black.ttf
            - asset: lib/assets/fonts/PilatExtended-Bold.ttf
            - asset: lib/assets/fonts/PilatExtended-Book.ttf
            - asset: lib/assets/fonts/PilatExtended-DemiBold.ttf
            - asset: lib/assets/fonts/PilatExtended-Heavy.ttf
            - asset: lib/assets/fonts/PilatExtended-Light.ttf
            - asset: lib/assets/fonts/PilatExtended-Regular.ttf
            - asset: lib/assets/fonts/PilatExtended-Thin.ttf


  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
